<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | Frontend Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="auth-body">
    <div class="login-container">
      <form id="change-password-form" class="login-form">
        <h1>Change Password</h1>
        <p id="change-password-message">Choose a new password</p>

        <div class="input-group">
          <label for="current-password">Current Password</label>
          <input
            type="password"
            id="current-password"
            name="currentPassword"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="input-group">
          <label for="new-password">New Password</label>
          <input
            type="password"
            id="new-password"
            name="password"
            placeholder="Min 8 chars, 1 upper, 1 num, 1 special"
            required
          />
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            placeholder="Re-enter your password"
            required
          />
        </div>

        <button type="submit" class="login-button">Change Password</button>
      </form>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
