<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Your Profile | Frontend Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="auth-body">
    <div class="login-container">
      <form id="profile-form" class="login-form">
        <h1>Complete Your Profile</h1>
        <p>Tell us a bit about yourself before continuing</p>

        <div class="input-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="firstName" required />
        </div>

        <div class="input-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="lastName" required />
        </div>

        <div class="input-group">
          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            name="address"
            title="Street address, P.O. box, company name, c/o"
            required
          />
        </div>

        <div class="input-group">
          <label for="address2">Address 2 (optional)</label>
          <input
            type="text"
            id="address2"
            name="address2"
            title="Apartment, suite, unit, building, floor, etc."
          />
        </div>

        <div class="input-group">
          <label for="state">State</label>
          <select id="state" name="state" required></select>
        </div>

        <div class="input-group">
          <label for="zip">Zip Code</label>
          <input
            type="text"
            id="zip"
            name="zip"
            inputmode="numeric"
            pattern="[0-9]{5}"
            title="5-digit US zip code"
            required
          />
        </div>

        <div class="input-group">
          <label for="country">Country</label>
          <select id="country" name="country" required></select>
        </div>

        <div class="input-group">
          <label for="phone">Phone / Text Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="(555) 555-5555"
            title="US phone number, e.g. (555) 555-5555"
            required
          />
        </div>

        <div class="input-group">
          <label for="communication-preference">Preferred Contact Method</label>
          <select
            id="communication-preference"
            name="communicationPreference"
            required
          >
            <option value="email">Email</option>
            <option value="text">Text</option>
            <option value="phone">Phone</option>
          </select>
        </div>

        <div class="input-group">
          <label for="linkedin">LinkedIn Profile (optional)</label>
          <input
            type="url"
            id="linkedin"
            name="linkedin"
            placeholder="https://linkedin.com/in/..."
            title="Full URL to your LinkedIn profile"
          />
        </div>

        <div class="input-group">
          <label for="github">GitHub Profile (optional)</label>
          <input
            type="url"
            id="github"
            name="github"
            placeholder="https://github.com/..."
            title="Full URL to your GitHub profile"
          />
        </div>

        <div class="input-group">
          <label for="alt-email">Additional Email (optional)</label>
          <input
            type="email"
            id="alt-email"
            name="altEmail"
            title="A second email address you'd like on file, if different from your login email"
          />
        </div>

        <button type="submit" class="login-button">Save Profile</button>
      </form>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
