<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Frontend Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="auth-body">
    <div class="login-container">
      <!-- Login Form -->
      <form id="login-form" class="login-form">
        <h1>Welcome Back</h1>
        <p>Please enter your details</p>

        <div class="input-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="login-button">Sign In</button>

        <div class="form-footer">
          <p>Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
          <p><a href="/forgot-password.html">Forgot password?</a></p>
          <p>
            Didn't get a verification email?
            <a href="/resend-verification.html">Resend it</a>
          </p>
        </div>
      </form>

      <!-- Sign Up Form (Hidden by default) -->
      <form id="signup-form" class="login-form" style="display: none">
        <h1>Create Account</h1>
        <p>Join us today</p>

        <div class="input-group">
          <label for="signup-email">Email</label>
          <input
            type="email"
            id="signup-email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            name="password"
            placeholder="Min 8 chars, 1 upper, 1 num, 1 special"
            required
          />
        </div>

        <div class="input-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input
            type="password"
            id="signup-confirm-password"
            name="confirmPassword"
            placeholder="Re-enter your password"
            required
          />
        </div>

        <button type="submit" class="login-button">Register</button>

        <div class="form-footer">
          <p>Already have an account? <a href="#" id="show-login">Log in</a></p>
        </div>
      </form>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
