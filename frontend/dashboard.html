<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Frontend Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <header id="page-header" class="page-header">
        <a id="logout-link" href="/index.html">Logout</a>
      </header>
      <div class="dashboard-card">
        <div
          class="user-list-section"
          id="user-list-section"
          style="display: none"
        >
          <h2>Users</h2>
          <details id="add-user-details" style="display: none">
            <summary class="add-user-toggle">Add User</summary>
            <form id="add-user-form" class="add-user-form">
              <input type="email" name="email" placeholder="Email" required />
              <input
                type="password"
                name="password"
                placeholder="Temporary password"
                required
              />
              <button type="submit" class="login-button">Add User</button>
            </form>
          </details>
          <div class="table-scroll">
            <table class="user-table">
              <thead>
                <tr>
                  <th class="sortable" data-sort="email" data-label="Email">
                    Email
                  </th>
                  <th class="sortable" data-sort="role" data-label="Role">
                    Role
                  </th>
                  <th
                    class="sortable"
                    data-sort="emailVerified"
                    data-label="Verified"
                  >
                    Verified
                  </th>
                  <th id="user-actions-header" style="display: none">
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody id="user-list"></tbody>
            </table>
          </div>
          <div id="user-pager" class="user-pager"></div>
        </div>
      </div>
      <footer id="page-footer" class="page-footer"></footer>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
